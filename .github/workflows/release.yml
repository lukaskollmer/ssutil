name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  releasetag:
    name: Tag Release
    uses: StanfordBDHG/.github/.github/workflows/action-release-tag.yml@v2
    permissions:
      contents: write
  build-and-upload:
    name: Build and Upload Binaries
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6"
      - name: Check environment
        run: |
            sw_vers
            xcodebuild -version
            swift --version
      - name: Build binary (Apple Silicon)
        run: swift build -c release --arch arm64 --product ssutil
      - name: Build binary (Intel)
        run: swift build -c release --arch x86_64 --product ssutil
      - name: Create archive
        run: |
          tar -czf ssutil-${{ github.event.release.tag_name }}-darwin-arm64.tar.gz -C .build/arm64-apple-macosx/release ssutil
          tar -czf ssutil-${{ github.event.release.tag_name }}-darwin-amd64.tar.gz -C .build/x86_64-apple-macosx/release ssutil
      - name: Upload binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} *.tar.gz
  homebrew-release:
    runs-on: ubuntu-latest
    name: Release to Homebrew
    # if: ${{ github.event.action == 'published' }}
    needs: [build-and-upload]
    steps:
      - name: Release project to Homebrew tap
        uses: Justintime50/homebrew-releaser@v2
        with:
          homebrew_owner: lukaskollmer
          homebrew_tap: homebrew-formulae
          formula_folder: Formula
          github_token: ${{ secrets.GH_PAT }}
          commit_owner: lukaskollmer
          commit_email: gh@lukaskollmer.de
          install: 'bin.install "ssutil"'
          target_darwin_arm64: true
          target_darwin_amd64: true
          update_readme_table: true
          skip_commit: false
          debug: false
